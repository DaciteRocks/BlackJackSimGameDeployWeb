<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Dacite</title>
    <meta name="theme-color" content="#0d0e12">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
        // SPA redirect for GitHub Pages
        // If the path belongs to an SPA sub-project, redirect to that app's
        // index.html with the route encoded as a query parameter so the
        // client-side router can restore the correct page.
        (function () {
            var spaProjects = ['parametriccastworks'];
            var path = location.pathname;
            for (var i = 0; i < spaProjects.length; i++) {
                var prefix = '/' + spaProjects[i] + '/';
                if (path.indexOf(prefix) === 0 && path.length > prefix.length) {
                    var repo = spaProjects[i];
                    var route = path.slice(prefix.length);
                    var query = location.search ? '&' + location.search.slice(1) : '';
                    location.replace(
                        '/' + repo + '/?p=/' + encodeURIComponent(route) + query + location.hash
                    );
                    return;
                }
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="center-screen">
        <div class="err-code">404</div>
        <p class="err-msg">This page doesn't exist.</p>
        <p class="err-sub">You've hit bedrock.</p>
        <a class="btn btn-primary" href="/">← Back to Home</a>
    </main>
</body>
</html>
